<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OneCare Facebook Sneak Peek Post</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0047AB; --blue-dark: #0A2A66; --navy: #0F1E3D;
    --green: #00BF63; --green-dark: #00A055; --teal: #0FB5A6;
    --muted: #5B6B82; --line: #E3EAF4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--navy);
    background:
      radial-gradient(700px 520px at 92% 30%, rgba(0,191,99,.16), transparent 60%),
      radial-gradient(700px 520px at 0% 0%, rgba(0,71,171,.12), transparent 60%),
      linear-gradient(180deg, #EEF5FF 0%, #F7FAFF 100%);
    position: relative;
  }
  .wrap { position: absolute; inset: 56px 96px 0; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo { height: 112px; margin-left: -18px; }
  .pill {
    display: inline-flex; align-items: center; gap: 12px;
    background: rgba(0,191,99,.12); color: var(--green-dark);
    font-weight: 800; font-size: 24px; letter-spacing: .12em; text-transform: uppercase;
    padding: 14px 26px; border-radius: 999px;
  }
  .pill i { width: 14px; height: 14px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 6px rgba(0,191,99,.22); }

  h1 { font-size: 76px; line-height: 1.03; font-weight: 800; letter-spacing: -.02em; margin-top: 34px; }
  h1 span { color: var(--green); }
  .sub { font-size: 29px; line-height: 1.4; color: var(--muted); margin-top: 16px; }
  .sub b { color: var(--blue); }

  /* Laptop */
  .stage { position: absolute; left: 0; right: 0; top: 470px; height: 560px; }
  .laptop { position: absolute; left: 30px; top: 22px; width: 740px; }
  .screen {
    background: #0F1E3D; border-radius: 26px 26px 0 0; padding: 18px 18px 22px;
    box-shadow: 0 40px 80px rgba(15,50,110,.28);
  }
  .screen .bar {
    height: 30px; background: #F1F5FB; border-radius: 8px 8px 0 0;
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
  }
  .screen .bar i { width: 10px; height: 10px; border-radius: 50%; background: #CBD5E1; }
  .screen .bar i:nth-child(1) { background: #FF6159; } .screen .bar i:nth-child(2) { background: #FFBD2E; } .screen .bar i:nth-child(3) { background: #28C941; }
  .screen .bar span {
    margin-left: 14px; flex: 1; height: 20px; border-radius: 6px; background: #fff;
    font-size: 13px; color: #5B6B82; display: flex; align-items: center; padding-left: 10px; font-weight: 600;
  }
  .screen img { display: block; width: 100%; aspect-ratio: 1440 / 900; object-fit: cover; object-position: top; border-radius: 0 0 4px 4px; }
  .base {
    height: 24px; margin: 0 -40px; border-radius: 0 0 26px 26px;
    background: linear-gradient(180deg, #E2E8F0, #B9C4D3);
    position: relative; box-shadow: 0 24px 40px rgba(15,50,110,.22);
  }
  .base::before { content: ""; position: absolute; left: 50%; top: 0; width: 140px; height: 10px; transform: translateX(-50%); background: #A3AFBF; border-radius: 0 0 10px 10px; }

  /* Phone */
  .phone {
    position: absolute; right: 0; top: 30px; width: 250px; height: 516px;
    background: #0F1E3D; border-radius: 44px; padding: 12px;
    box-shadow: 0 40px 80px rgba(15,50,110,.35);
  }
  .phone .glass { width: 100%; height: 100%; border-radius: 34px; overflow: hidden; position: relative; background: #fff; }
  .phone iframe { width: 390px; height: 760px; border: 0; margin-top: 26px; transform: scale(.5795); transform-origin: 0 0; pointer-events: none; }
  .phone .notch { position: absolute; left: 50%; top: 10px; width: 86px; height: 24px; transform: translateX(-50%); background: #0F1E3D; border-radius: 14px; z-index: 2; }

  .date-badge {
    position: absolute; right: 200px; top: -40px; z-index: 3; text-align: center;
    background: linear-gradient(150deg, var(--green), var(--teal)); color: #fff;
    border-radius: 26px; padding: 16px 24px 14px; box-shadow: 0 16px 36px rgba(0,160,85,.35);
  }
  .date-badge small { display: block; font-size: 19px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .92; }
  .date-badge b { display: block; font-size: 58px; font-weight: 800; line-height: 1; margin-top: 2px; }

  .bar-foot {
    position: absolute; left: 0; right: 0; bottom: 0; height: 150px;
    background: linear-gradient(100deg, var(--blue) 0%, #1565D8 50%, var(--teal) 100%);
    color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 96px;
  }
  .bar-foot .item { display: flex; align-items: center; gap: 14px; }
  .bar-foot .ic { width: 52px; height: 52px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); display: grid; place-items: center; flex: none; }
  .bar-foot b { display: block; font-size: 25px; line-height: 1.2; }
  .bar-foot small { font-size: 19px; opacity: .88; }
  .bar-foot .sep { width: 1px; height: 70px; background: rgba(255,255,255,.3); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <img class="logo" src="../assets/logo.png" alt="OneCare Diagnostics">
    </div>
    <h1>Take a Peek at Our<br><span>New Website!</span></h1>
    <p class="sub">Launching October 18 at <b>onecarediagnostics.com</b></p>

    <div class="stage">
      <div class="laptop">
        <div class="screen">
          <div class="bar"><i></i><i></i><i></i><span>onecarediagnostics.com</span></div>
          <img src="site-desktop.png" alt="">
        </div>
        <div class="base"></div>
      </div>
      <div class="date-badge"><small>Oct</small><b>18</b></div>
      <div class="phone">
        <div class="glass">
          <span class="notch"></span>
          <iframe src="https://onecare-diagnostics.vercel.app/" scrolling="no"></iframe>
        </div>
      </div>
    </div>
  </div>

  <div class="bar-foot">
    <div class="item">
      <div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
      <div><b>+63 985 188 8881</b><small>Call or text us</small></div>
    </div>
    <span class="sep"></span>
    <div class="item">
      <div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
      <div><b>Poblacion Central</b><small>Dumanjug, Cebu</small></div>
    </div>
    <span class="sep"></span>
    <div class="item">
      <div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
      <div><b>Mon–Sat</b><small>7:30AM–5:00PM</small></div>
    </div>
  </div>
</body>
</html>
